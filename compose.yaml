services:
  sasman:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_PATH: /data/sasman.db
    volumes:
      - sasman_data:/data
volumes:
  sasman_data:
